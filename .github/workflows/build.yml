name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake libpipewire-0.3-dev libspa-0.2-dev libsdl2-dev libgl-dev libegl-dev libx11-dev libxext-dev

      - name: Configure + build (Linux)
        run: |
          cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release
          cmake --build desktop/build -j

      - name: Run self-test
        run: desktop/build/sync_selftest

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: desktop/build
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build pipewire_sync_win.exe (MSVC)
        run: cl /nologo /W4 /O2 /MT /std:c++17 /DNDEBUG desktop\windows\pipewire_sync_win.cpp /link ole32.lib oleaut32.lib uuid.lib winmm.lib mmdevapi.lib /Fe:pipewire_sync_win.exe

      # Same ImGui+SDL2 panel as Linux, driving pipewire_sync_win.exe over
      # the --ui pipe. vcpkg manifest mode (desktop/vcpkg.json) installs SDL2
      # automatically through the toolchain; x64-windows-static links it IN
      # so sync_gui.exe ships as one file with no SDL2.dll. OpenGL ships
      # with the Windows SDK.
      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat"
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build sync_gui.exe (MSVC + static SDL2)
        run: |
          cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build desktop/build --config Release --target sync_gui
          if (!(Test-Path desktop/build/Release/sync_gui.exe)) { Write-Error "sync_gui missing"; exit 1 }
          copy desktop\build\Release\sync_gui.exe sync_gui.exe

      # Ship-blocking guard: a dynamic-linking regression here re-creates the
      # #1 field bug ("SDL2.dll not found" / "VCRUNTIME140.dll missing" on a
      # clean machine). Both exes must depend on OS DLLs only.
      - name: Verify exes are self-contained (no DLL dependents)
        run: |
          $bad = 0
          foreach ($exe in @("pipewire_sync_win.exe", "sync_gui.exe")) {
            $deps = dumpbin /nologo /dependents $exe
            $deps | ForEach-Object { Write-Host $_ }
            if ($deps -match 'SDL2\.dll|VCRUNTIME140|MSVCP140') {
              Write-Host "::error::$exe still depends on SDL2.dll/VC runtime - static build regressed"
              $bad = 1
            }
          }
          exit $bad

      # One-click installer: per-user (no admin), Start Menu + Desktop
      # shortcuts straight to the GUI, uninstaller. No console window
      # anywhere in the user-facing path - START_HERE.bat is retired from
      # distribution (it stays in the repo for source checkouts).
      - name: Build OMEH-Setup-1.0.0.exe (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { Write-Error "ISCC.exe not found after choco install"; exit 1 }
          # Relative Source/OutputDir resolve against the script's own folder
          # (SourceDir), so stage the exes next to installer.iss and compile
          # with no command-line defines - nothing path-like to quote/parse.
          copy sync_gui.exe, pipewire_sync_win.exe desktop\windows\
          & $iscc desktop\windows\installer.iss
          if ($LASTEXITCODE -ne 0 -or !(Test-Path desktop\windows\OMEH-Setup-1.0.0.exe)) {
            Write-Error "installer build failed"
            exit 1
          }
          move desktop\windows\OMEH-Setup-1.0.0.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: |
            pipewire_sync_win.exe
            sync_gui.exe
            OMEH-Setup-1.0.0.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1

      - name: Point local.properties at the CI SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Assemble debug APK
        run: |
          cd android
          ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-assets:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ linux, windows, android ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release (draft) + attach binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-artifacts/desktop/build/sync_gui
            artifacts/linux-artifacts/desktop/build/sync_master
            artifacts/linux-artifacts/desktop/build/sync_client
            artifacts/linux-artifacts/desktop/build/sync_selftest
            artifacts/linux-artifacts/desktop/build/pipewire_sync
            artifacts/windows-artifact/pipewire_sync_win.exe
            artifacts/windows-artifact/sync_gui.exe
            artifacts/windows-artifact/OMEH-Setup-1.0.0.exe
            artifacts/android-artifact/android/app/build/outputs/apk/debug/app-debug.apk
          draft: true
          prerelease: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}

